<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <linearGradient id="drum" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fdba74"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="512" height="512" rx="104" fill="url(#bg)"/>

  <!-- storage drum / bucket (Garage object storage) -->
  <g transform="translate(46,40)">
    <path d="M 60 150 L 40 330 Q 40 372 190 372 Q 340 372 340 330 L 320 150 Z" fill="url(#drum)"/>
    <line x1="52" y1="230" x2="328" y2="230" stroke="#c2410c" stroke-width="10" opacity="0.55"/>
    <ellipse cx="190" cy="150" rx="130" ry="42" fill="url(#rim)"/>
    <ellipse cx="190" cy="150" rx="130" ry="42" fill="none" stroke="#9a3412" stroke-width="6" opacity="0.5"/>
  </g>

  <!-- admin gear badge -->
  <g transform="translate(336,336)">
    <circle cx="0" cy="0" r="92" fill="#0b1120" stroke="#1e293b" stroke-width="8"/>
    <g fill="#e2e8f0">
      <circle cx="0" cy="0" r="46"/>
      <g>
        <rect x="-9" y="-70" width="18" height="26" rx="4"/>
        <rect x="-9" y="44" width="18" height="26" rx="4"/>
        <rect x="-9" y="-70" width="18" height="26" rx="4" transform="rotate(45)"/>
        <rect x="-9" y="44" width="18" height="26" rx="4" transform="rotate(45)"/>
        <rect x="-9" y="-70" width="18" height="26" rx="4" transform="rotate(90)"/>
        <rect x="-9" y="44" width="18" height="26" rx="4" transform="rotate(90)"/>
        <rect x="-9" y="-70" width="18" height="26" rx="4" transform="rotate(135)"/>
        <rect x="-9" y="44" width="18" height="26" rx="4" transform="rotate(135)"/>
      </g>
    </g>
    <circle cx="0" cy="0" r="20" fill="#0b1120"/>
  </g>
</svg>
